  <style>
    /* ═══ SUBJECT HUB SCOPED STYLES ═══ */
    /* These classes ONLY exist on hub pages. Everything else comes from garden.css */

    .subject-hub { max-width: 1100px; margin: 0 auto; padding: 2rem 2rem 4rem; }

    /* ── Hub Hero ── */
    .hub-hero {
      position: relative;
      padding: 4rem 2.5rem 3rem;
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 3rem;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
    }
    .hub-hero::before {
      content: '';
      position: absolute; inset: 0;
      opacity: 0.06;
      pointer-events: none;
    }
    .hub-hero-content { position: relative; z-index: 1; }
    .hub-hero-badge {
      display: inline-flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 1.5rem;
      background: var(--brand-glow);
      border: 1px solid var(--brand-500);
      border-radius: var(--radius-pill);
      font-family: var(--display-font);
      font-weight: 800; font-size: 1rem;
      color: var(--brand-500);
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }
    .hub-hero-badge i { font-size: 1.1rem; }
    .hub-hero h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      margin-bottom: 1rem;
      line-height: 1.3;
    }
    .hub-hero-metaphor {
      font-size: 1.15rem;
      color: var(--text-secondary);
      font-style: italic;
      max-width: 600px;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }
    .hub-stats {
      display: flex; flex-wrap: wrap; gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .hub-stat {
      display: flex; align-items: center; gap: 0.5rem;
      font-weight: 700; font-size: 0.95rem;
      color: var(--text-muted);
    }
    .hub-stat strong {
      color: var(--brand-500);
      font-family: var(--display-font);
      font-size: 1.25rem;
    }

    /* ── Progress Ring ── */
    .hub-progress {
      display: flex; align-items: center; gap: 1.5rem;
      padding: 1.5rem 2rem;
      border-radius: var(--radius-xl);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      margin-bottom: 2.5rem;
    }
    .progress-ring-container {
      width: 80px; height: 80px; flex-shrink: 0;
      position: relative;
    }
    .progress-ring-container svg { transform: rotate(-90deg); }
    .progress-ring-bg { fill: none; stroke: var(--bg-elevated); stroke-width: 6; }
    .progress-ring-fill { fill: none; stroke: var(--brand-500); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
    .progress-ring-text {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--display-font); font-weight: 900; font-size: 1.1rem;
      color: var(--brand-500);
    }
    .progress-info h3 { font-size: 1.1rem; margin-bottom: 0.25rem; }
    .progress-info p { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

    /* ── Section Wrapper (divider + header + divider) ── */
    .hub-section-wrapper {
      display: flex; align-items: center; gap: 1.5rem;
      margin: 3rem 0 2rem;
    }

    /* ── Section Headers ── */
    .hub-section-header {
      display: flex; align-items: center; justify-content: center; gap: 1rem;
      padding: 0 1rem;
      flex-shrink: 0;
    }
    .hub-section-header h2 {
      font-size: 1.45rem; font-weight: 800; margin: 0;
    }
    .hub-section-header .section-count {
      font-size: 0.85rem; font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-elevated);
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-pill);
    }

    /* ── Module Grid — always 2 columns (1 on mobile) ── */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    /* ── Module Card ── */
    .module-card {
      display: flex; flex-direction: column;
      padding: 1.75rem;
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }
    .module-card:hover {
      border-color: var(--brand-500);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px -8px var(--brand-glow), 0 4px 10px -4px var(--shadow-base);
    }
    .module-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .module-card-number {
      width: 40px; height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--display-font);
      font-weight: 900; font-size: 1rem;
    }
    .module-card-flavor {
      font-size: 0.75rem; font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-elevated);
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-pill);
      font-family: var(--display-font);
      letter-spacing: 0.03em;
    }
    .module-card h3 {
      font-size: 1.1rem; font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      line-height: 1.5;
    }
    .module-card-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.7;
      flex: 1;
      margin-bottom: 1rem;
    }
    .module-card-meta {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      font-size: 0.8rem; font-weight: 700;
      color: var(--text-muted);
    }
    .module-card-meta span {
      display: inline-flex; align-items: center; gap: 0.3rem;
    }
    /* Completion checkmark overlay */
    .module-card[data-completed="true"]::after {
      content: '✓';
      position: absolute; top: 1rem; inset-inline-end: 1rem;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #10b981;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 900;
    }

    /* ── Exam Hub Section ── */
    .exam-hub {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .exam-card {
      padding: 2rem;
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }
    .exam-card:hover {
      border-color: var(--brand-500);
      box-shadow: 0 8px 20px -6px var(--brand-glow);
    }
    .exam-card-header {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .exam-card-icon {
      width: 44px; height: 44px;
      border-radius: var(--radius-md);
      background: var(--brand-glow);
      color: var(--brand-500);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .exam-card h3 { font-size: 1.15rem; font-weight: 800; }
    .exam-card p {
      font-size: 0.9rem; color: var(--text-secondary);
      line-height: 1.7; margin-bottom: 1.25rem;
    }
    .exam-card-scope {
      font-size: 0.8rem; font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .exam-card-links {
      display: flex; gap: 0.75rem;
    }
    .exam-link {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.9rem; font-weight: 700;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .exam-link--review {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .exam-link--review:hover {
      border-color: var(--brand-500);
      color: var(--brand-500);
      background: var(--brand-glow);
    }
    .exam-link--quiz {
      background: var(--brand-500);
      border: 1px solid var(--brand-500);
      color: #fff;
    }
    .exam-link--quiz:hover {
      background: var(--brand-600);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--brand-glow);
    }

    /* ── Motivational Footer Quote ── */
    .hub-quote {
      text-align: center;
      padding: 1rem 1.5rem;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--text-muted);
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ── Subject-specific hero patterns ── */
    [data-subject="DS499"] {
      --brand-600: #d97706;
      --brand-500: #f59e0b;
      --brand-400: #fbbf24;
      --brand-glow: rgba(245,158,11,0.12);
    }
    [data-subject="DS499"] .hub-hero::before {
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='0' width='40' height='40' fill='none' stroke='%23f59e0b' stroke-width='0.3'/%3E%3C/svg%3E");
    }

    /* ── Thematic divider (animated for CS353 & CS351, static for others) ── */
    .hub-divider {
      height: 2px;
      background: var(--border-color);
      border-radius: var(--radius-pill);
      position: relative;
      overflow: hidden;
      flex: 1;
      margin: 0;
    }
    .hub-divider::after {
      content: '';
      position: absolute; top: 0;
      width: 40px; height: 100%;
      background: var(--brand-500);
      border-radius: var(--radius-pill);
    }

    /* dir-rtl: dot moves left→right */
    .hub-divider.dir-rtl::after {
      left: -40px;
      animation: raceLineRTL 3s ease-in-out infinite;
    }
    /* dir-ltr: dot moves right→left */
    .hub-divider.dir-ltr::after {
      right: -40px;
      animation: raceLineLTR 3s ease-in-out infinite;
    }

    [data-subject="DS499"] .hub-divider.dir-rtl::after { animation: raceLineRTL 4s ease infinite; }
    [data-subject="DS499"] .hub-divider.dir-ltr::after { animation: raceLineLTR 4s ease infinite; }

    @keyframes raceLineRTL {
      0%   { left: -40px; }
      100% { left: 100%; }
    }
    @keyframes raceLineLTR {
      0%   { right: -40px; }
      100% { right: 100%; }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .subject-hub { padding: 1rem 1rem 3rem; }
      .hub-hero { padding: 2.5rem 1.5rem 2rem; }
      .hub-hero h1 { font-size: 1.75rem; }
      .module-grid { grid-template-columns: 1fr; }
      .exam-hub { grid-template-columns: 1fr; }
      .hub-progress { flex-direction: column; text-align: center; }
      .exam-card-links { flex-direction: column; }
      .hub-section-wrapper { gap: 0.75rem; }
    }
  </style>

<!-- Progress Ring: reads quiz scores from localStorage -->
<script>
(function(){
  const code = document.documentElement.getAttribute('data-subject') || '';
  const total = 13;
  let done = 0;
  for (let i = 1; i <= total; i++) {
    const key = 'garden_' + code + '_m' + i + '_quiz';
    try { if (parseInt(localStorage.getItem(key)) > 0) done++; } catch(e) {}
  }
  const pct = Math.round((done / total) * 100);
  const ring = document.getElementById('progress-ring');
  const text = document.getElementById('progress-pct');
  if (ring) {
    const circum = 213.6;
    ring.style.strokeDashoffset = circum - (circum * pct / 100);
  }
  if (text) text.textContent = pct + '%';

  // Mark completed modules
  document.querySelectorAll('.module-card').forEach(card => {
    const num = card.querySelector('.module-card-number')?.textContent?.trim();
    if (num) {
      const key = 'garden_' + code + '_m' + num + '_quiz';
      try { if (parseInt(localStorage.getItem(key)) >= 7) card.setAttribute('data-completed', 'true'); } catch(e) {}
    }
  });
})();
</script>
